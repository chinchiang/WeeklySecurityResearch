name: Check source links

on:
  schedule:
    # Mondays 09:00 Asia/Taipei (01:00 UTC)
    - cron: "0 1 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-links:
    name: Verify reading sources are reachable
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # Unreachable sources are reported, never fatal: a third-party outage
      # must not block the repository, but it must be visible.
      - name: Check source and PDF links
        id: links
        run: |
          set +e
          node scripts/check-links.mjs > links.log 2>&1
          echo "status=$?" >> "$GITHUB_OUTPUT"
          cat links.log

      - name: Publish result to the job summary
        run: |
          if [ "${{ steps.links.outputs.status }}" = "0" ]; then
            { echo "## 連結檢查通過"; echo; cat links.log; } >> "$GITHUB_STEP_SUMMARY"
          else
            { echo "## ⚠️ 有原始來源無法存取（僅提示，不阻擋 CI）"; echo; echo '```json'; cat links.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=check:links::部分原始來源無法存取，請查看 job summary"
          fi
