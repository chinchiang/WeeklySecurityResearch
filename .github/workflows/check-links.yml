name: Check source links

on:
  schedule:
    # Mondays 09:00 Asia/Taipei (01:00 UTC)
    - cron: "0 1 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-links:
    name: Verify reading sources are reachable
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # Unreachable sources are reported, never fatal: a third-party outage
      # must not block the repository, but it must be visible. A crash of the
      # checker itself is a different thing and does fail the job, otherwise
      # a broken script would look like "all links fine" forever.
      - name: Check source and PDF links
        id: links
        run: |
          set +e
          npm run --silent check:links > links.log 2>&1
          status=$?
          set -e
          if [ "$status" = "0" ]; then
            echo "outcome=pass" >> "$GITHUB_OUTPUT"
          elif node -e 'const j=JSON.parse(require("fs").readFileSync("links.log","utf8"));process.exit(Array.isArray(j)?0:1)' 2>/dev/null; then
            echo "outcome=unreachable" >> "$GITHUB_OUTPUT"
          else
            echo "outcome=error" >> "$GITHUB_OUTPUT"
          fi
          cat links.log

      - name: Publish result to the job summary
        run: |
          case "${{ steps.links.outputs.outcome }}" in
            pass)
              { echo "## 連結檢查通過"; echo; cat links.log; } >> "$GITHUB_STEP_SUMMARY" ;;
            unreachable)
              { echo "## ⚠️ 有原始來源無法存取（僅提示，不阻擋 CI）"; echo; echo '```json'; cat links.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
              echo "::warning title=check:links::部分原始來源無法存取，請查看 job summary" ;;
            *)
              { echo "## ❌ 連結檢查工具本身執行失敗"; echo; echo '```'; cat links.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
              echo "::error title=check:links::scripts/check-links.mjs 未能執行，這不是連結失效，請修正腳本"
              exit 1 ;;
          esac
