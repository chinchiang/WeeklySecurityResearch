name: Check source links

on:
  schedule:
    # Mondays 09:00 Asia/Taipei (01:00 UTC)
    - cron: "0 1 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-links:
    name: Verify reading sources are reachable
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # Unreachable sources are reported, never fatal: a third-party outage
      # must not block the repository, but it must be visible. A crash of the
      # checker itself is a different thing and does fail the job, otherwise
      # a broken script would look like "all links fine" forever.
      - name: Check source and PDF links
        id: links
        run: |
          set +e
          node --experimental-strip-types scripts/check-links.mjs > links.json 2> links.stderr.log
          status=$?
          set -e
          node scripts/report-links.mjs classify "$status"

      # The gate owns the result even when summary publication is unavailable.
      - name: Enforce link checker result
        if: always()
        env:
          LINK_OUTCOME: ${{ steps.links.outputs.outcome }}
        run: |
          case "$LINK_OUTCOME" in
            pass) echo "Source/PDF link check passed." ;;
            unreachable) echo "::warning title=check:links::部分原始來源無法存取；這是連結檢查結果，不是工具故障。" ;;
            *) echo "::error title=check:links::連結檢查工具或結果契約失敗；請查看 JSON 與 stderr log。"; exit 1 ;;
          esac

      - name: Publish result to the job summary
        if: always()
        continue-on-error: true
        run: node scripts/report-links.mjs summary
