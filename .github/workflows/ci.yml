name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Superseded PR runs are cancelled; main runs are not, so a deploy that has
  # started is never interrupted by the next push.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: Build and data integrity
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CI: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Preserve published readings and weekly links
        if: github.event_name != 'workflow_dispatch'
        env:
          # PRs compare with their base; pushes to main compare with the commit
          # main pointed to before, so direct pushes cannot skip this check.
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Only a push can legitimately lack its base (history rewrite); a PR
          # base is always fetched, so a missing one there is an error.
          if [ "$GITHUB_EVENT_NAME" = push ] && ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "::warning title=check-history::Base commit $BASE_SHA is not available (new branch or rewritten history); history check skipped."
            exit 0
          fi
          node --experimental-strip-types scripts/check-history.mjs "$BASE_SHA"

      # npm test exports the Pages site to out/ and runs tests/ and checks/
      # against it; that out/ is the artifact deployed below.
      - name: Build Pages export and run all tests
        run: npm test

      - name: Run ESLint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Run Security Audit
        run: npm run audit

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: out

  deploy-pages:
    name: Publish GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: build-and-test
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check Pages configuration
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy checked artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
