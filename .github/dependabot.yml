version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Taipei
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # @types/node tracks the runtime in .nvmrc (Node 22); newer majors
      # describe APIs CI does not have. Bump it together with .nvmrc.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # eslint-config-next depends on eslint-plugin-react, whose latest 7.37.x
      # still calls context.getFilename() (removed in ESLint 10) and declares
      # eslint ^9.7 as its peer. Lift this once that plugin supports ESLint 10.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Taipei
    open-pull-requests-limit: 5
