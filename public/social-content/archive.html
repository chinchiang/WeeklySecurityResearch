uman sign-ins and endpoint processes.\n- Re-run adversarial evaluations after model or platform changes; do not treat a one-time test as a lasting guarantee.\n\n#AgenticAI #AISecurity #IdentitySecurity #ZeroTrust #SOC"},"newsletter":{"zh":"Zenity Labs 於 7 月 23 日揭露 AgentForger，研究者主張特定條件下可透過單一連結建立並持續執行惡意 Workspace Agent；第三方報導稱問題已修補且無已知濫用證據。NIST／UK AISI 同日發布 Kimi K3 初步 cyber capability 評估，提醒企業應把模型能力與 Agent 權限、connectors、approval、schedule 分開治理。（來源：Zenity Labs、NIST／UK AISI，2026-07-23；The Hacker News，2026-07-24）\n\n#AgenticAI #AISecurity #IdentitySecurity #ZeroTrust #SOC","en":"Zenity Labs disclosed AgentForger on 23 July, claiming that under certain conditions a single link could create and persistently run a malicious Workspace Agent; independent reporting says the issue was fixed with no known exploitation. A NIST/UK AISI preliminary Kimi K3 cyber-capability assessment published the same day reinforces the need to govern model capability separately from agent permissions, connectors, approvals and schedules. (Sources: Zenity Labs and NIST/UK AISI, 23 July 2026; The Hacker News, 24 July 2026)\n\n#AgenticAI #AISecurity #IdentitySecurity #ZeroTrust #SOC"},"evidence":"1. Zenity Labs 於 2026-07-23 揭露 AgentForger；研究者主張一個 phishing link 可在特定前提下驅動 Workspace Agent 建立流程，沿用受害者已授權的 connectors，並形成持續運作的惡意 Agent。\n   Zenity Labs — AgentForger, Part 1: ChatGPT Cross-Site Agent Forgery (2026-07-23) — https://labs.zenity.io/p/agentforger-part-1-chatgpt-cross-site-agent-forgery\n2. 獨立媒體報導稱問題已於 2026-06-08 修補，且沒有已知遭利用證據；目前未找到 OpenAI 對研究細節的獨立公開確認，因此不可把所有研究者敘述視為廠商承認。\n   The Hacker News — ChatGPT AgentForger Flaw Could Deploy Rogue Workspace Agents via a Phishing Link (2026-07-24) — https://thehackernews.com/2026/07/chatgpt-agentforger-flaw-could-deploy.html\n3. NIST／UK AISI 於 2026-07-23 發布 Kimi K3 初步 cyber capability 評估：其整體表現低於最前沿模型，但 safeguards 未阻止模型嘗試 exploit development 或 offensive cyber operations；研究同時明列樣本與評估條件限制。\n   NIST / UK AISI — Preliminary Assessment of Kimi K3's Cyber Capabilities (2026-07-23) — https://www.nist.gov/news-events/news/2026/07/uk-aisi-caisi-preliminary-assessment-kimi-k3s-cyber-capabilities\n\n- Zenity Labs — AgentForger, Part 1: ChatGPT Cross-Site Agent Forgery (2026-07-23)\n  https://labs.zenity.io/p/agentforger-part-1-chatgpt-cross-site-agent-forgery\n- The Hacker News — ChatGPT AgentForger Flaw Could Deploy Rogue Workspace Agents via a Phishing Link (2026-07-24)\n  https://thehackernews.com/2026/07/chatgpt-agentforger-flaw-could-deploy.html\n- NIST / UK AISI — UK AISI / CAISI Preliminary Assessment of Kimi K3's Cyber Capabilities (2026-07-23)\n  https://www.nist.gov/news-events/news/2026/07/uk-aisi-caisi-preliminary-assessment-kimi-k3s-cyber-capabilities\n\n- AgentForger 技術敘述主要來自發現者 Zenity Labs，屬原始研究者主張；The Hacker News、TechRadar 與 SecurityWeek 提供獨立報導，但不是廠商技術驗證。\n- 「已修補」與「無已知濫用」來自 Zenity／媒體敘述；本次搜尋未找到 OpenAI 對完整事件細節的公開確認，文件已明確保留此限制。\n- Kimi K3 結果是 NIST／UK AISI 的 preliminary assessment；NIST 說明測試範圍有限、部分比較模型關閉 safeguards，不能直接外推真實攻擊成功率。\n- 「能力 × 權限」風險模型是本報告的分析框架，不代表三個來源使用相同術語或直接互相驗證。","sources":[{"url":"https://labs.zenity.io/p/agentforger-part-1-chatgpt-cross-site-agent-forgery","publisher":"Zenity Labs","title":"AgentForger, Part 1: ChatGPT Cross-Site Agent Forgery","date":"2026-07-23"},{"url":"https://thehackernews.com/2026/07/chatgpt-agentforger-flaw-could-deploy.html","publisher":"The Hacker News","title":"ChatGPT AgentForger Flaw Could Deploy Rogue Workspace Agents via a Phishing Link","date":"2026-07-24"},{"url":"https://www.nist.gov/news-events/news/2026/07/uk-aisi-caisi-preliminary-assessment-kimi-k3s-cyber-capabilities","publisher":"NIST / UK AISI","title":"UK AISI / CAISI Preliminary Assessment of Kimi K3's Cyber Capabilities","date":"2026-07-23"}],"legacy":{"order":2,"topicCode":"SEC","priority":"P1 / 高討論度","angle":"把 AgentForger 揭露與 NIST／UK AISI 對 Kimi K3 的 cyber capability 評估放在同一張風險圖上：model capability 與 system authority 是兩個不同軸。企業既要測模型能做什麼，也要治理 Agent 能連到哪裡、用誰的權限、能否關閉核准、如何排程與留下 runtime evidence。","publicationValue":"避免把 AI Security 縮減成 jailbreak 或 prompt filtering，改以 identity、connector、approval、persistence 與 capability 的乘積思考 Agent 風險。","evidence":[{"claim":"Zenity Labs 於 2026-07-23 揭露 AgentForger；研究者主張一個 phishing link 可在特定前提下驅動 Workspace Agent 建立流程，沿用受害者已授權的 connectors，並形成持續運作的惡意 Agent。","source":"Zenity Labs — AgentForger, Part 1: ChatGPT Cross-Site Agent Forgery","date":"2026-07-23","url":"https://labs.zenity.io/p/agentforger-part-1-chatgpt-cross-site-agent-forgery","classification":"研究者主張／原始研究"},{"claim":"獨立媒體報導稱問題已於 2026-06-08 修補，且沒有已知遭利用證據；目前未找到 OpenAI 對研究細節的獨立公開確認，因此不可把所有研究者敘述視為廠商承認。","source":"The Hacker News — ChatGPT AgentForger Flaw Could Deploy Rogue Workspace Agents via a Phishing Link","date":"2026-07-24","url":"https://thehackernews.com/2026/07/chatgpt-agentforger-flaw-could-deploy.html","classification":"第三方報導"},{"claim":"NIST／UK AISI 於 2026-07-23 發布 Kimi K3 初步 cyber capability 評估：其整體表現低於最前沿模型，但 safeguards 未阻止模型嘗試 exploit development 或 offensive cyber operations；研究同時明列樣本與評估條件限制。","source":"NIST / UK AISI — Preliminary Assessment of Kimi K3's Cyber Capabilities","date":"2026-07-23","url":"https://www.nist.gov/news-events/news/2026/07/uk-aisi-caisi-preliminary-assessment-kimi-k3s-cyber-capabilities","classification":"已證實／官方初步評估"}],"linkedin":{"language":"繁體中文","text":"AI Agent 安全的盲點，不是模型答錯，而是 Agent 以合法身分做了不該做的事。\n\n本週 AgentForger 揭露與 NIST／UK AISI 的 Kimi K3 初評共同提醒：model capability 與 system authority 必須分開看。能力較低，不代表 safeguards 足以阻擋 offensive cyber assistance。\n\n企業需建立 Agent inventory、connector allowlist、least privilege 與 runtime detection。\n\n你能否列出每個 Agent 的 owner、連線範圍與自動執行權限？"},"x":{"language":"繁體中文","parts":["1/4 AI Agent 風險不能只看模型能力；「合法身分 × connectors × 自動核准 × 排程」可能比單次 prompt 更危險。","2/4 Zenity Labs 本週揭露 AgentForger；研究者稱特定條件下，一個連結可驅動惡意 Agent 建立流程。媒體稱已修補、無已知濫用證據。","3/4 同日 NIST／UK AISI 的 Kimi K3 初評顯示：能力低於前沿模型，不代表 safeguards 足以阻擋 offensive cyber assistance。","4/4 實務控制：Agent inventory、connector allowlist、least privilege、approval policy、schedule review、runtime telemetry。Prompt filter 只是其中一層。"]},"blog":{"title":"從 AgentForger 到 Kimi K3：AI Security 必須同時治理能力與權限","points":["建立雙軸評估：model cyber capability 與 deployed agent authority 不混為一談。","把 Agent 視為 privileged workload：記錄 owner、service identity、connected apps、data scope、approval mode 與 schedule。","對 Agent 建立／發布／權限擴張設定獨立核准與高風險組態阻擋，不讓使用者既有 OAuth consent 自動等同於新 Agent 授權。","SOC 應監看 Agent lifecycle 與 tool-call behavior，而不只監看人類帳號登入或端點 process。","模型或平台更新後重新執行 adversarial evaluation；避免以一次性安全測試當作長期保證。"]},"newsletter":"Zenity Labs 於 7 月 23 日揭露 AgentForger，研究者主張特定條件下可透過單一連結建立並持續執行惡意 Workspace Agent；第三方報導稱問題已修補且無已知濫用證據。NIST／UK AISI 同日發布 Kimi K3 初步 cyber capability 評估，提醒企業應把模型能力與 Agent 權限、connectors、approval、schedule 分開治理。（來源：Zenity Labs、NIST／UK AISI，2026-07-23；The Hacker News，2026-07-24）","hashtags":["#AgenticAI","#AISecurity","#IdentitySecurity","#ZeroTrust","#SOC"],"verification":["AgentForger 技術敘述主要來自發現者 Zenity Labs，屬原始研究者主張；The Hacker News、TechRadar 與 SecurityWeek 提供獨立報導，但不是廠商技術驗證。","「已修補」與「無已知濫用」來自 Zenity／媒體敘述；本次搜尋未找到 OpenAI 對完整事件細節的公開確認，文件已明確保留此限制。","Kimi K3 結果是 NIST／UK AISI 的 preliminary assessment；NIST 說明測試範圍有限、部分比較模型關閉 safeguards，不能直接外推真實攻擊成功率。","「能力 × 權限」風險模型是本報告的分析框架，不代表三個來源使用相同術語或直接互相驗證。"]}},{"id":"ot-plc-project-file-risk","week":"2026-07-27","topic":"OT / Manufacturing","status":"Ready","title":"PLC 被攻擊時，最危險的不是停機，而是產線仍在跑、保護邏輯卻已被改掉","hook":"美國最新聯合警報描述的不只是 Internet-exposed PLC：攻擊者會拿走 project files、用原廠 configuration software 修改邏輯，甚至讓 shutdown 與 alarm 不再可信。","tags":["OTSecurity","ICSSecurity","ManufacturingSecurity","OperationalResilience","PLC"],"linkedin":{"zh":"最危險的 OT incident，未必是工廠停機；也可能是保護邏輯已被修改，產線卻仍持續運轉。\n\n美國多個聯邦機關於 7 月 22 日更新 Iranian-affiliated actors 攻擊 Internet-connected PLC 的聯合警報 AA26-097A。更新擴及 Rockwell Automation／Allen-Bradley、Schneider Electric 與 Siemens 設備，並描述 project-file 外洩與修改、HMI／SCADA 操弄，以及可能停用關鍵 shutdown 與 alarm logic 的變更。\n\n重要邊界：警報已確認的受影響領域是美國政府設施、水務與能源，不是製造業；但 PLC 家族、engineering tools 與 attack path 可高度轉移至工廠。\n\n製造業應把 PLC project files 與原廠 configuration tools 視為 crown jewels：移除直接暴露、為檔案建立 baseline／signature、監看工程工具使用、獨立驗證 safety logic，並演練 trusted restoration。\n\n你的工廠能否證明，今天執行的邏輯就是昨天工程團隊核准的版本？\n\n#OTSecurity #ICSSecurity #ManufacturingSecurity #OperationalResilience #PLC","en":"The most dangerous OT incident may not be the plant stopping. It may be the plant continuing to run after its protection logic has been changed.\n\nOn 22 July, U.S. agencies updated joint advisory AA26-097A on Iranian-affiliated actors targeting internet-connected PLCs. The update expands observed targeting to Rockwell Automation/Allen-Bradley, Schneider Electric and Siemens devices. It describes project-file theft and modification, HMI/SCADA manipulation, and changes that could disable critical shutdown and alarm logic.\n\nImportant boundary: the confirmed affected sectors named in the advisory are U.S. government facilities, water/wastewater and energy—not manufacturing. But the PLC families, engineering tools and attack path are highly transferable to factories.\n\nFor manufacturers, PLC project files and vendor configuration tools should be treated as crown jewels: remove direct exposure, baseline and sign project files, monitor engineering-tool use, validate safety logic independently, and rehearse trusted restoration.\n\nCould your plant prove that the logic running today is the logic engineering approved yesterday?\n\n#OTSecurity #ICSSecurity #ManufacturingSecurity #OperationalResilience #PLC"},"twitter":{"zh":"1/4 最危險的 OT incident 未必讓工廠停機；也可能讓 shutdown 與 alarm logic 已被改動的產線繼續運轉。\n\n2/4 美國更新版 AA26-097A 描述 Iranian-affiliated actors 外洩／修改 PLC project files，並操弄 HMI／SCADA data。\n\n3/4 已確認領域是美國政府設施、水務與能源，不是製造業；但受影響 PLC 家族與 engineering tools 廣泛存在於工業環境。\n\n4/4 把 PLC projects 當 crown jewels：移除直接暴露、簽署／baseline 檔案、監看 configuration tools、獨立驗證 safety logic、演練 trusted restore。\n\n#OTSecurity #ICSSecurity #ManufacturingSecurity #OperationalResilience #PLC","en":"1/4 The worst OT incident may not stop the plant. It may let the plant keep running after shutdown and alarm logic has been altered.\n\n2/4 Updated U.S. advisory AA26-097A describes Iranian-affiliated actors stealing/modifying PLC project files and manipulating HMI/SCADA data.\n\n3/4 Confirmed sectors: U.S. government facilities, water/wastewater and energy—not manufacturing. But the affected PLC families and engineering tools are common across industrial environments.\n\n4/4 Treat PLC projects as crown jewels: remove direct exposure, sign/baseline files, monitor configuration tools, independently validate safety logic, and rehearse trusted restore.\n\n#OTSecurity #ICSSecurity #ManufacturingSecurity #OperationalResilience #PLC"},"blog":{"zh":"**當 PLC 還在運轉但邏輯已不可信：製造業應從 AA26-097A 學到什麼**\n\n- 事實邊界：官方確認的受害領域不含製造業；本文談的是可轉移至工廠的 PLC／engineering tool 攻擊模式。\n- 將 PLC project files、AOI／reusable code、HMI／SCADA configuration 與 engineering workstation 納入完整性管理與備份。\n- 比對 running logic、approved golden copy、hash／signature 與最後修改者，不只依賴設備「仍在線」或製程數值看似正常。\n- 監看 Studio 5000、EcoStruxure Control Expert、TIA Portal 等 configuration software 的來源主機、使用者、時間與變更內容。\n- 讓 safety validation 與 cyber recovery 聯動：隔離 Internet exposure、保護遠端存取、演練 clean project restore，並由 OT engineering 確認安全條件。\n\n#OTSecurity #ICSSecurity #ManufacturingSecurity #OperationalResilience #PLC","en":"**Title:** When the PLC Still Runs but Its Logic Cannot Be Trusted: Manufacturing Lessons from AA26-097A\n\n- Evidence boundary: confirmed affected sectors do not include manufacturing; this analysis focuses on PLC and engineering-tool attack patterns transferable to factories.\n- Apply integrity management and backup controls to PLC project files, reusable code, HMI/SCADA configurations and engineering workstations.\n- Compare running logic with an approved golden copy, hash/signature and authorised modifier—not only whether the device remains online.\n- Monitor the source host, user, time and change content for Studio 5000, EcoStruxure Control Expert and TIA Portal activity.\n- Link safety validation to cyber recovery: isolate internet exposure, protect remote access, rehearse clean-project restoration and require OT engineering sign-off.\n\n#OTSecurity #ICSSecurity #ManufacturingSecurity #OperationalResilience #PLC"},"newsletter":{"zh":"美國多個聯邦機關於 7 月 22 日更新 AA26-097A，警告 Iranian-affiliated actors 正針對 Internet-connected PLCs，並新增 Schneider Electric 與 Siemens 等觀察目標。雖然官方確認受影響領域為美國政府設施、水務與能源，而非製造業，但 project-file 外洩／竄改、HMI／SCADA 操弄及 safety logic 失效的攻擊路徑，對使用相同 PLC 與工程工具的工廠具有直接參考價值。（來源：CISA／IC3，2026-07-22；SecurityWeek，2026-07-23）\n\n#OTSecurity #ICSSecurity #ManufacturingSecurity #OperationalResilience #PLC","en":"U.S. federal agencies updated AA26-097A on 22 July, warning that Iranian-affiliated actors were targeting internet-connected PLCs and adding Schneider Electric and Siemens devices to observed targets. Although confirmed affected sectors are U.S. government facilities, water/wastewater and energy—not manufacturing—the project-file theft/modification, HMI/SCADA manipulation and safety-logic risks are directly relevant to factories using the same PLCs and engineering tools. (Sources: CISA/IC3, 22 July 2026; SecurityWeek, 23 July 2026)\n\n#OTSecurity #ICSSecurity #ManufacturingSecurity #OperationalResilience #PLC"},"evidence":"1. FBI、CISA、NSA、EPA、DOE、USCYBERCOM 與 Treasury 於 2026-07-22 更新 AA26-097A，擴大納入 Rockwell Automation／Allen-Bradley、Schneider Electric、Siemens 及可能其他 PLC 品牌；警報指出已造成營運中斷與財務損失。\n   CISA / IC3 — Iranian-Affiliated Cyber Actors Exploit Programmable Logic Controllers Across US Critical Infrastructure (2026-07-22 update) — https://www.ic3.gov/CSA/2026/260722.pdf\n2. 警報描述攻擊者使用原廠 configuration software 取得、外洩、修改或刪除 PLC project files，並操弄 HMI／SCADA 顯示；個案中新增邏輯覆寫維持安全操作參數的 instruction sets。\n   CISA — AA26-097A advisory page and July 2026 update (2026-07-22 update) — https://www.cisa.gov/news-events/cybersecurity-advisories/aa26-097a\n3. SecurityWeek 交叉報導指出，更新內容涵蓋 Rockwell Studio 5000 Logix Designer、Schneider EcoStruxure Control Expert 與 Siemens TIA Portal，並引述警報稱變更可能停用關鍵 shutdown／alarm logic，使系統進入不安全狀態而未告警。\n   SecurityWeek — US Warns of Iranian Hackers Targeting Siemens, Schneider, and Rockwell ICS Devices (2026-07-23) — https://www.securityweek.com/us-warns-of-iranian-hackers-targeting-siemens-schneider-and-rockwell-ics-devices/\n\n- FBI / CISA / NSA / EPA / DOE / CNMF / Treasury via IC3 — Iranian-Affiliated Cyber Actors Exploit Programmable Logic Controllers Across US Critical Infrastructure (AA26-097A, July update) (2026-07-22)\n  https://www.ic3.gov/CSA/2026/260722.pdf\n- CISA — Iranian-Affiliated Cyber Actors Exploit Programmable Logic Controllers Across US Critical Infrastructure (2026-07-22 update)\n  https://www.cisa.gov/news-events/cybersecurity-advisories/aa26-097a\n- SecurityWeek — US Warns of Iranian Hackers Targeting Siemens, Schneider, and Rockwell ICS Devices (2026-07-23)\n  https://www.securityweek.com/us-warns-of-iranian-hackers-targeting-siemens-schneider-and-rockwell-ics-devices/\n\n- 攻擊活動、受影響領域、PLC 品牌、project-file 操弄與主要緩解措施來自美國政府聯合警報及其 2026-07-22 更新。\n- 「對電子製造業高度可轉移」是基於相同 PLC 家族與工程工具的專業分析；本次來源沒有證實 Inventec、臺灣電子製造商或一般 manufacturing sector 已遭此波行動入侵。\n- 安全邏輯可能被停用是警報及 SecurityWeek 引述的個案描述，不表示每一台受影響型號都已遭同樣修改。\n- 文章不提供 IOCs、攻擊步驟或可操作的 PLC 修改方式；發布前可依組織政策決定是否保留 actor attribution。","sources":[{"url":"https://www.ic3.gov/CSA/2026/260722.pdf","publisher":"FBI / CISA / NSA / EPA / DOE / CNMF / Treasury via IC3","title":"Iranian-Affiliated Cyber Actors Exploit Programmable Logic Controllers Across US Critical Infrastructure (AA26-097A, July update)","date":"2026-07-22"},{"url":"https://www.cisa.gov/news-events/cybersecurity-advisories/aa26-097a","publisher":"CISA","title":"Iranian-Affiliated Cyber Actors Exploit Programmable Logic Controllers Across US Critical Infrastructure","date":"2026-07-22 update"},{"url":"https://www.securityweek.com/us-warns-of-iranian-hackers-targeting-siemens-schneider-and-rockwell-ics-devices/","publisher":"SecurityWeek","title":"US Warns of Iranian Hackers Targeting Siemens, Schneider, and Rockwell ICS Devices","date":"2026-07-23"}],"legacy":{"order":3,"topicCode":"OT","priority":"P0 / 高衝擊","angle":"從 2026-07-22 更新的美國聯合資安警報，提醒電子製造業把 PLC project files、engineering workstations、vendor configuration tools 與 safety logic 納入 crown jewels。此警報確認的受害領域是美國政府設施、水務與能源，不應誤稱製造業已受害；但其 PLC 品牌、工具與攻擊路徑對工廠高度可轉移。","publicationValue":"同時兼顧攻擊實證、OT safety 與製造業治理，不落入「看到 CVE 就叫停機修補」的簡化敘事。","evidence":[{"claim":"FBI、CISA、NSA、EPA、DOE、USCYBERCOM 與 Treasury 於 2026-07-22 更新 AA26-097A，擴大納入 Rockwell Automation／Allen-Bradley、Schneider Electric、Siemens 及可能其他 PLC 品牌；警報指出已造成營運中斷與財務損失。","source":"CISA / IC3 — Iranian-Affiliated Cyber Actors Exploit Programmable Logic Controllers Across US Critical Infrastructure","date":"2026-07-22 update","url":"https://www.ic3.gov/CSA/2026/260722.pdf","classification":"已證實／政府聯合警報"},{"claim":"警報描述攻擊者使用原廠 configuration software 取得、外洩、修改或刪除 PLC project files，並操弄 HMI／SCADA 顯示；個案中新增邏輯覆寫維持安全操作參數的 instruction sets。","source":"CISA — AA26-097A advisory page and July 2026 update","date":"2026-07-22 update","url":"https://www.cisa.gov/news-events/cybersecurity-advisories/aa26-097a","classification":"已證實／官方"},{"claim":"SecurityWeek 交叉報導指出，更新內容涵蓋 Rockwell Studio 5000 Logix Designer、Schneider EcoStruxure Control Expert 與 Siemens TIA Portal，並引述警報稱變更可能停用關鍵 shutdown／alarm logic，使系統進入不安全狀態而未告警。","source":"SecurityWeek — US Warns of Iranian Hackers Targeting Siemens, Schneider, and Rockwell ICS Devices","date":"2026-07-23","url":"https://www.securityweek.com/us-warns-of-iranian-hackers-targeting-siemens-schneider-and-rockwell-ics-devices/","classification":"第三方交叉報導"}],"linkedin":{"language":"English","text":"The most dangerous OT incident may not be the plant stopping. It may be the plant continuing to run after its protection logic has been changed.\n\nOn 22 July, U.S. agencies updated joint advisory AA26-097A on Iranian-affiliated actors targeting internet-connected PLCs. The update expands observed targeting to Rockwell Automation/Allen-Bradley, Schneider Electric and Siemens devices. It describes project-file theft and modification, HMI/SCADA manipulation, and changes that could disable critical shutdown and alarm logic.\n\nImportant boundary: the confirmed affected sectors named in the advisory are U.S. government facilities, water/wastewater and energy—not manufacturing. But the PLC families, engineering tools and attack path are highly transferable to factories.\n\nFor manufacturers, PLC project files and vendor configuration tools should be treated as crown jewels: remove direct exposure, baseline and sign project files, monitor engineering-tool use, validate safety logic independently, and rehearse trusted restoration.\n\nCould your plant prove that the logic running today is the logic engineering approved yesterday?"},"x":{"language":"English","parts":["1/4 The worst OT incident may not stop the plant. It may let the plant keep running after shutdown and alarm logic has been altered.","2/4 Updated U.S. advisory AA26-097A describes Iranian-affiliated actors stealing/modifying PLC project files and manipulating HMI/SCADA data.","3/4 Confirmed sectors: U.S. government facilities, water/wastewater and energy—not manufacturing. But the affected PLC families and engineering tools are common across industrial environments.","4/4 Treat PLC projects as crown jewels: remove direct exposure, sign/baseline files, monitor configuration tools, independently validate safety logic, and rehearse trusted restore."]},"blog":{"title":"當 PLC 還在運轉但邏輯已不可信：製造業應從 AA26-097A 學到什麼","points":["事實邊界：官方確認的受害領域不含製造業；本文談的是可轉移至工廠的 PLC／engineering tool 攻擊模式。","將 PLC project files、AOI／reusable code、HMI／SCADA configuration 與 engineering workstation 納入完整性管理與備份。","比對 running logic、approved golden copy、hash／signature 與最後修改者，不只依賴設備「仍在線」或製程數值看似正常。","監看 Studio 5000、EcoStruxure Control Expert、TIA Portal 等 configuration software 的來源主機、使用者、時間與變更內容。","讓 safety validation 與 cyber recovery 聯動：隔離 Internet exposure、保護遠端存取、演練 clean project restore，並由 OT engineering 確認安全條件。"]},"newsletter":"美國多個聯邦機關於 7 月 22 日更新 AA26-097A，警告 Iranian-affiliated actors 正針對 Internet-connected PLCs，並新增 Schneider Electric 與 Siemens 等觀察目標。雖然官方確認受影響領域為美國政府設施、水務與能源，而非製造業，但 project-file 外洩／竄改、HMI／SCADA 操弄及 safety logic 失效的攻擊路徑，對使用相同 PLC 與工程工具的工廠具有直接參考價值。（來源：CISA／IC3，2026-07-22；SecurityWeek，2026-07-23）","hashtags":["#OTSecurity","#ICSSecurity","#ManufacturingSecurity","#OperationalResilience","#PLC"],"verification":["攻擊活動、受影響領域、PLC 品牌、project-file 操弄與主要緩解措施來自美國政府聯合警報及其 2026-07-22 更新。","「對電子製造業高度可轉移」是基於相同 PLC 家族與工程工具的專業分析；本次來源沒有證實 Inventec、臺灣電子製造商或一般 manufacturing sector 已遭此波行動入侵。","安全邏輯可能被停用是警報及 SecurityWeek 引述的個案描述，不表示每一台受影響型號都已遭同樣修改。","文章不提供 IOCs、攻擊步驟或可操作的 PLC 修改方式；發布前可依組織政策決定是否保留 actor attribution。"]}}],LATEST="2026-08-10",MODE='archive';
const content=document.querySelector('#content'),search=document.querySelector('#search'),weekFilter=document.querySelector('#weekFilter'),usageFilter=document.querySelector('#usageFilter'),usageSummary=document.querySelector('#usageSummary'),toast=document.querySelector('#toast');
const USED_KEY='everyweek-social-used-v1';
function loadUsed(){try{const value=JSON.parse(localStorage.getItem(USED_KEY)||'[]');return new Set(Array.isArray(value)?value:[])}catch{return new Set()}}
let usedIds=loadUsed();
function itemKey(x){return x.week+'::'+x.id}
function isUsed(x){return usedIds.has(itemKey(x))}
function saveUsed(){try{localStorage.setItem(USED_KEY,JSON.stringify([...usedIds].sort()))}catch{}}
function setUsedButton(btn,used){btn.setAttribute('aria-pressed',String(used));btn.setAttribute('aria-label',used?'取消已使用標示':'將本貼文標示為已使用');btn.innerHTML='<span class="used-icon" aria-hidden="true">'+(used?'✓':'')+'</span><span class="used-label">'+(used?'已使用 · 取消':'標示為已使用')+'</span>'}
function updateUsageSummary(){if(!usageSummary)return;const latest=ITEMS.filter(x=>x.week===LATEST),count=latest.filter(isUsed).length;usageSummary.textContent='已使用 '+count+'／'+latest.length}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function renderText(raw){const lines=raw.split(/\n/),out=[];let list=false;const fmt=s=>esc(s).replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>').replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>');for(const line of lines){if(/^[-*] /.test(line)){if(!list){out.push('<ul>');list=true}out.push('<li>'+fmt(line.slice(2))+'</li>');continue}if(list){out.push('</ul>');list=false}if(/^\*\*.*\*\*$/.test(line))out.push('<h4>'+fmt(line)+'</h4>');else if(line.trim())out.push('<p>'+fmt(line)+'</p>')}if(list)out.push('</ul>');return out.join('')}
function safeUrl(url){return /^https:\/\//i.test(String(url))?url:'#'}function fmtDate(iso){const d=new Date(iso+'T00:00:00');return d.getFullYear()+' 年 '+(d.getMonth()+1)+' 月 '+d.getDate()+' 日（'+['週日','週一','週二','週三','週四','週五','週六'][d.getDay()]+'）'}
function coverage(iso){const e=new Date(iso+'T00:00:00');const s=new Date(e);s.setDate(s.getDate()-7);return(s.getMonth()+1)+'/'+s.getDate()+'–'+(e.getMonth()+1)+'/'+e.getDate()+' 本週重點新聞'}
function channel(title,raw,open=false,extra=''){const bilingual=raw&&typeof raw==='object';const body=bilingual?'<div class="langbar" role="tablist" aria-label="草稿語言"><button class="lang-button active" type="button" data-lang="zh" role="tab" aria-selected="true">繁體中文</button><button class="lang-button" type="button" data-lang="en" role="tab" aria-selected="false">English</button></div><section class="lang-panel" data-panel="zh" lang="zh-Hant"><button class="copy" type="button">複製中文版</button><div class="draft-body">'+renderText(raw.zh)+'</div></section><section class="lang-panel" data-panel="en" lang="en" hidden><button class="copy" type="button">Copy English</button><div class="draft-body">'+renderText(raw.en)+'</div></section>':'<button class="copy" type="button">複製本段</button><div class="draft-body">'+renderText(raw)+'</div>';return '<details class="channel '+extra+'" '+(open?'open':'')+'><summary><span class="summary-title">'+esc(title)+'</span><span class="toggle"></span></summary><div class="draft">'+body+'</div></details>'}
function idea(x,index,open){const used=isUsed(x),key=itemKey(x);return '<article class="idea '+(used?'used':'')+'" data-idea-key="'+esc(key)+'"><div class="idea-top"><div class="idea-kicker">選題 '+String(index+1).padStart(2,'0')+' · '+esc(x.topic)+'</div><button class="used-button" type="button" data-used-key="'+esc(key)+'" aria-pressed="'+used+'" aria-label="'+(used?'取消已使用標示':'將本貼文標示為已使用')+'"><span class="used-icon" aria-hidden="true">'+(used?'✓':'')+'</span><span class="used-label">'+(used?'已使用 · 取消':'標示為已使用')+'</span></button></div><h3>'+esc(x.title)+'</h3><p class="hook">'+esc(x.hook)+'</p><div class="sources">'+x.sources.map(s=>'<a href="'+esc(safeUrl(s.url))+'" target="_blank" rel="noopener"'+(s.title?' title="'+esc(s.title)+(s.date?' · '+esc(s.date):'')+'"':'')+'>'+esc(s.publisher)+' ↗</a>').join('')+'</div><div class="tags">'+x.tags.map(t=>'<span>#'+esc(t)+'</span>').join('')+'</div>'+channel('LinkedIn 草稿（中／英，可直接貼上）',x.linkedin,open)+channel('Twitter／X 推文串（中／英）',x.twitter)+channel('Blog 部落格要點（中／英）',x.blog)+channel('Newsletter／簡訊（中／英）',x.newsletter)+channel('來源、支撐論點與查核備註',x.evidence,false,'evidence')+'</article>'}
function bind(){document.querySelectorAll('.used-button').forEach(btn=>btn.onclick=()=>{const key=btn.dataset.usedKey,used=usedIds.has(key);if(used)usedIds.delete(key);else usedIds.add(key);saveUsed();updateUsageSummary();if(usageFilter?.value){render();return}const card=btn.closest('.idea'),next=!used;card.classList.toggle('used',next);setUsedButton(btn,next)});document.querySelectorAll('.lang-button').forEach(btn=>btn.onclick=()=>{const draft=btn.closest('.draft'),lang=btn.dataset.lang;draft.querySelectorAll('.lang-button').forEach(x=>{const active=x===btn;x.classList.toggle('active',active);x.setAttribute('aria-selected',String(active))});draft.querySelectorAll('.lang-panel').forEach(panel=>panel.hidden=panel.dataset.panel!==lang)});document.querySelectorAll('.copy').forEach(btn=>btn.onclick=async()=>{await navigator.clipboard.writeText(btn.nextElementSibling.innerText);toast.textContent=btn.textContent.includes('English')?'English draft copied':'已複製本段草稿';toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1300)})}
function render(){const term=(search?.value||'').trim().toLowerCase(),selected=weekFilter?.value||'',usage=usageFilter?.value||'';updateUsageSummary();const weeks=[...new Set(ITEMS.map(x=>x.week))].sort().reverse().filter(w=>MODE==='latest'?w===LATEST:(!selected||w===selected));let shown=0;content.innerHTML=weeks.map(w=>{const xs=ITEMS.filter(x=>x.week===w).filter(x=>!term||[x.title,x.hook,x.topic,x.tags.join(' '),x.linkedin.zh,x.linkedin.en,x.twitter.zh,x.twitter.en,x.blog.zh,x.blog.en,x.newsletter.zh,x.newsletter.en,x.evidence].join(' ').toLowerCase().includes(term)).filter(x=>usage==='used'?isUsed(x):usage==='unused'?!isUsed(x):true);shown+=xs.length;if(!xs.length)return'';return '<section class="week"><header class="week-head"><div><h2>'+fmtDate(w)+'</h2><p>涵蓋 '+coverage(w)+' · '+xs.length+' 個可發布選題</p></div>'+(w===LATEST?'<span class="latest">最新一週</span>':'')+'</header>'+xs.map((x,i)=>idea(x,i,MODE==='latest'&&i===0)).join('')+'</section>'}).join('')||'<div class="empty">沒有符合條件的素材。</div>';bind()}
if(weekFilter){const weeks=[...new Set(ITEMS.map(x=>x.week))].sort().reverse();weekFilter.innerHTML='<option value="">全部歷史週次</option>'+weeks.map(w=>'<option value="'+w+'">'+w+'</option>').join('');weekFilter.onchange=render}if(usageFilter)usageFilter.onchange=render;if(search)search.oninput=render;render();
</script></body></html>
